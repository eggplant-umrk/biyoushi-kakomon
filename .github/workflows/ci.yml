name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 既定は読み取りだけ（SPEC §8.5）。デプロイジョブだけ pages / id-token の書き込みを足す
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ランナーの apt が遅く playwright install --with-deps が終わらないため、ブラウザ入りの公式イメージで実行する。
    # タグは package.json の @playwright/test と同じ版にそろえる（ダイジェストで固定）
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Firebase Emulator（セキュリティルールのテストと E2E）に Java が必要
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Install firebase-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/firebase-tools" --no-audit --no-fund firebase-tools@15.35.0
          echo "$RUNNER_TEMP/firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm run validate -- --expect 41-54
      # 教科書の参照の決まり（登録済みの教科書・対象の分野・確信度）。目次・索引との突き合わせは、写真のある手元で行う（docs/textbook-howto.md）
      - run: node scripts/textbook-refs.ts verify
      - run: npm test
      # セキュリティルールのテスト（SPEC §8.1）。通らなければマージもデプロイもしない
      - run: npm run test:rules
      # 本番と同じ設定でビルドし、管理者メールやテスト用のコードが入っていないか調べる（SPEC §6.5）
      - name: Production build check
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          npm run build
          bash scripts/check-dist.sh dist
      # 上の検査が効いていることの確認：ビルド結果の写しに、ダミーの管理者メールとテスト用の文字列を仕込み、検査が失敗することを確かめる
      - run: bash scripts/check-dist.sh --self-test dist
      # E2E（Auth・Firestore Emulator に対して、iPhone・Pixel のエミュレーションで実行）
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build
      # 公開する前に、管理者メールやテスト用のコードが入っていないことを確かめる（入っていたらデプロイしない）
      - name: Check build output
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          REQUIRE_ADMIN_EMAIL: '1'
        run: bash scripts/check-dist.sh dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
