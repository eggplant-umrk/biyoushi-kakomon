version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # CI のコンテナイメージ（mcr.microsoft.com/playwright）と版をそろえる必要があるので手動で上げる
      - dependency-name: '@playwright/test'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ['*']
